name: Publicar versión para Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Comprobar versión y etiqueta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release-version

      - name: Instalar dependencias de Node.js
        run: npm ci

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Ejecutar pruebas JavaScript
        run: npm test

      - name: Ejecutar pruebas Python
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Preparar Python y construir instalador NSIS
        run: npm run release

      - name: Verificar artefactos de actualización
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          Get-Item "dist\CERTI_UEEH-Setup-$version.exe"
          Get-Item "dist\CERTI_UEEH-Setup-$version.exe.blockmap"
          Get-Item "dist\latest.yml"

      - name: Publicar Release con todos los assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Stop-Release([string]$Message) {
            $escaped = $Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Publicación de Release::$escaped"
            throw $Message
          }

          $version = "${{ github.ref_name }}".Substring(1)
          $createOutput = gh release create "${{ github.ref_name }}" `
            "dist\CERTI_UEEH-Setup-$version.exe" `
            "dist\CERTI_UEEH-Setup-$version.exe.blockmap" `
            "dist\latest.yml" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title "${{ github.ref_name }}" `
            --notes-from-tag `
            --latest 2>&1
          if ($LASTEXITCODE -ne 0) {
            Stop-Release "GitHub CLI no pudo crear la Release: $($createOutput | Out-String)"
          }

          $releaseJson = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets,isDraft,isPrerelease,url 2>&1
          if ($LASTEXITCODE -ne 0) {
            Stop-Release "No se pudo leer la Release publicada: $($releaseJson | Out-String)"
          }
          $release = $releaseJson | ConvertFrom-Json
          $expectedAssets = @(
            "CERTI_UEEH-Setup-$version.exe",
            "CERTI_UEEH-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($asset in $expectedAssets) {
            if ($assetNames -notcontains $asset) {
              Stop-Release "Falta el asset requerido: $asset. Assets presentes: $($assetNames -join ', ')"
            }
          }
          if ($release.isDraft -or $release.isPrerelease) {
            Stop-Release "GitHub dejó la Release como borrador o prerelease."
          }
          Write-Output "Release publicada: $($release.url)"
