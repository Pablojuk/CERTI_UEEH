name: Publicar versión para Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Comprobar versión y etiqueta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release-version

      - name: Instalar dependencias de Node.js
        run: npm ci

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Ejecutar pruebas JavaScript
        run: npm test

      - name: Ejecutar pruebas Python
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Preparar Python y subir instalador a borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Verificar artefactos de actualización
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          Get-Item "dist\CERTI_UEEH-Setup-$version.exe"
          Get-Item "dist\CERTI_UEEH-Setup-$version.exe.blockmap"
          Get-Item "dist\latest.yml"

      - name: Validar assets y publicar Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "CERTI-UEEH-Release"
          }
          $releasesUri = "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          $releases = Invoke-RestMethod -Uri $releasesUri -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -eq "${{ github.ref_name }}" } | Select-Object -First 1
          if (-not $release) {
            throw "No se encontró el borrador para ${{ github.ref_name }}."
          }
          if (-not $release.draft) {
            throw "La Release debe permanecer en borrador hasta validar todos los assets."
          }

          $version = "${{ github.ref_name }}".Substring(1)
          $expectedAssets = @(
            "CERTI_UEEH-Setup-$version.exe",
            "CERTI_UEEH-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($asset in $expectedAssets) {
            if ($assetNames -notcontains $asset) {
              throw "Falta el asset requerido: $asset"
            }
          }

          $body = @{
            draft = $false
            prerelease = $false
            make_latest = "true"
          } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -Body $body -ContentType "application/json"
          if ($published.draft -or $published.prerelease) {
            throw "GitHub no publicó la Release final."
          }
          Write-Output "Release publicada: $($published.html_url)"
